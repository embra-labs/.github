name: "Báo lỗi / Bug report"
description: "Báo lỗi website, tài liệu hoặc CLI bằng các bước tái hiện cụ thể."
body:
  - type: markdown
    attributes:
      value: |
        Bạn có thể viết tiếng Việt hoặc English.
        Đây là báo cáo công khai. Không đăng token, mật khẩu, connection string hoặc dữ liệu khách hàng.
        Lỗi bảo mật hoặc liên quan tài khoản riêng: liên hệ **hello@embra.cloud** thay vì mở issue công khai.
        Câu hỏi về alpha: xem [hướng dẫn hỗ trợ](https://github.com/embra-labs/.github/blob/main/SUPPORT.md).
  - type: dropdown
    id: area
    attributes:
      label: "Phần gặp lỗi / Affected area"
      options:
        - "Website"
        - "Tài liệu / Documentation"
        - "CLI"
        - "Khác / Other"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Trang hoặc phiên bản / Page or version"
      description: "Website/docs: URL không chứa token và trình duyệt. CLI: phiên bản, OS và CPU. Ghi không rõ nếu chưa biết."
      placeholder: "Ví dụ: https://embra.cloud/ — Firefox, Android."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "Cách tái hiện / Steps to reproduce"
      description: "Mô tả các bước tối thiểu bằng dữ liệu thử. Nếu không tái hiện được, ghi lần xảy ra và múi giờ."
      placeholder: |
        1. Mở trang hoặc chạy thao tác…
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Kết quả mong đợi / Expected behavior"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Kết quả thực tế / Actual behavior"
      description: "Thông báo lỗi, nội dung sai hoặc hành vi bạn thấy."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Thông tin bổ sung / Additional context"
      description: "Không bắt buộc: ảnh đã che thông tin riêng, đoạn lỗi ngắn, tần suất. Không dán toàn bộ log, file .env hoặc credential."
  - type: checkboxes
    id: privacy
    attributes:
      label: "Trước khi gửi / Before submitting"
      options:
        - label: "Tôi đã kiểm tra nội dung không chứa secret hoặc dữ liệu riêng. / I checked that this report contains no secrets or private data."
          required: true
